<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Modal</title>
    <link rel="stylesheet" href="search.css">
</head>
<body>
    <div id="search-modal" class="fade-hidden">
        <div class="search-box">
            <div class="search-header">Search Players</div>
            <input type="text" id="search-input" placeholder="Enter name or ID..." autocomplete="off">
            <div class="search-btn-container">
                <span class="search-btn" id="search-btn">Search or clear</span>
            </div>
        </div>
    </div>
    <script src="search.js"></script>
</body>
</html>
