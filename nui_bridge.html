<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21Menu NUI Bridge</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }
        iframe {
            border: none;
            width: 100%;
            height: 100%;
            background: transparent;
        }
    </style>
</head>
<body>
    <iframe id="main-frame" src=""></iframe>
    <script>
        document.getElementById("main-frame").src = "https://bbaraaaaa.github.io/21menu/index.html?v=" + new Date().getTime();
        window.addEventListener("message", function(event) {
            let iframe = document.querySelector("iframe");
            
            // Forward messages from iframe back to FiveM Lua
            if (event.data && event.data.action === "searchResult") {
                fetch(`https://${GetParentResourceName()}/searchResult`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: event.data.query })
                });
            } else if (event.data && event.data.action === "searchCancel") {
                fetch(`https://${GetParentResourceName()}/searchCancel`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });
            }
            
            // Forward FiveM NUI messages to the GitHub iframe
            if (iframe && iframe.contentWindow && (!event.data || !event.data.fromIframe)) {
                iframe.contentWindow.postMessage(event.data, "*");
            }
        });
    </script>
</body>
</html>
