<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21 Menu</title>
    <link rel="stylesheet" href="style.css?v=9">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .fade-hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            transition: opacity 0.2s ease;
        }
        .fade-visible {
            opacity: 1 !important;
            pointer-events: auto !important;
            transition: opacity 0.2s ease;
        }
    </style>
</head>
<body>
    <div id="keybind-overlay" class="fade-hidden">
        <div class="keybind-box">
            <div class="keybind-header">
                <img src="banner.png" alt="21" class="keybind-logo">
            </div>
            <div class="keybind-content">
                <p class="keybind-title">Menu bind</p>
                <p class="keybind-inst" id="keybind-inst">Enter Menu Open Key ...</p>
                <div class="keybind-btn" id="keybind-btn">Waiting for input...</div>
            </div>
        </div>
    </div>

    <!-- Notifications -->
    <div id="notification-container"></div>

    <!-- Search Modal -->
    <div id="search-modal" class="fade-hidden">
        <div class="search-box">
            <div class="search-header">Search Players</div>
            <input type="text" id="search-input" placeholder="Enter name or ID..." autocomplete="off">
            <div class="search-btn-container">
                <span class="search-btn" id="search-btn">Search or clear</span>
            </div>
        </div>
    </div>

    <div id="menu-container" class="fade-hidden">
        <!-- Ped Preview Container -->
        <img id="ped-preview" src="" class="fade-hidden" style="position:absolute; right: -220px; top: 0; width: 200px; height: 400px; object-fit: cover; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.8); box-shadow: 0 0 15px rgba(0,0,0,0.5);">
        
        <div class="menu-banner">
            <img src="banner.png" alt="21 Banner">
        </div>
        
        <div class="menu-header">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <div id="category-title" class="category-title"></div>
                <div style="font-size:10px; color:#fff; opacity:0.5; padding-right:15px;">v=8</div>
            </div>
            <div class="menu-tabs" id="menu-tabs">
                <!-- Tabs injected by JS -->
            </div>
        </div>

        <div class="menu-items" id="menu-items">
            <!-- Items injected by JS -->
        </div>

        <div class="menu-footer">
            <div class="footer-left">
                <span class="footer-brand">21</span> <span class="footer-divider">|</span> <span class="footer-link">discord.gg/2121</span> <span class="footer-divider">|</span> <span class="footer-bind">[F7] Bind</span>
            </div>
            <div class="footer-right">
                <span id="page-indicator">1/1</span>
            </div>
        </div>
    </div>

    <script src="script.js?v=9"></script>
</body>
</html>
