<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21 SAVAGE MENU</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=New+Rocker&family=Metal+Mania&display=swap" rel="stylesheet">
</head>
<body>
    
    <!-- Keybind Popup Overlay -->
    <div id="keybind-overlay" class="fade-hidden">
        <div class="keybind-box">
            <div class="keybind-header">
                <img src="https://i.imgur.com/3q1jO7F.png" alt="icon">
                <span>callmeanger</span>
            </div>
            <p class="keybind-title">Menu bind</p>
            <p class="keybind-instruction" id="keybind-inst">Enter Menu Open Key ...</p>
            <div class="keybind-btn" id="keybind-btn">Waiting for input...</div>
        </div>
    </div>

    <!-- Main Menu UI -->
    <div id="menu-container" class="fade-visible" style="opacity: 1; pointer-events: all; transform: scale(1);">
        <div class="banner">
            <img src="banner.jpg" alt="21 SAVAGE" onerror="this.src='https://i.imgur.com/c6Oqz7P.png'">
            <div class="banner-text">21</div>
        </div>
        
        <div class="header">
            <h2 id="category-title">MAIN MENU</h2>
        </div>
        
        <!-- ARYA Horizontal Tabs -->
        <div class="tabs-container" id="tabs-container">
            <!-- Default for preview -->
            <div class="tab active">List</div>
            <div class="tab">Safe</div>
            <div class="tab">Troll</div>
            <div class="tab">Vehicle</div>
        </div>
        
        <!-- Smooth Slider Selection -->
        <div class="list-wrapper">
            <div class="selection-box active" id="selection-box" style="transform: translateY(40px);"></div>
            <div class="items-list" id="items-list">
                <!-- Preview items so he can see it immediately in browser -->
                <div class="menu-item">
                    <div class="left">Search</div>
                    <div class="right"><span>< Search ></span></div>
                </div>
                <div class="menu-item selected">
                    <div class="left">Method</div>
                    <div class="right"><span>< Default ></span></div>
                </div>
                <div class="menu-item">
                    <div class="left">Show Selected Player Info</div>
                    <div class="right"><div class="toggle-switch"></div></div>
                </div>
                <div class="menu-item menu-separator">--- Players ---</div>
                <div class="menu-item">
                    <div class="left">BluntSnaily2559</div>
                    <div class="right"><div class="toggle-switch on"></div></div>
                </div>
            </div>
        </div>

        <div class="footer">
            <span class="footer-left">21 | discord.gg/2121 | [F7] Bind</span>
            <span class="footer-right" id="pagination">1/21</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
