<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21menu UI</title>
    <link rel="stylesheet" href="style.css?v=11">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Keybind Overlay (Sleek Modern Style) -->
    <div id="keybind-overlay" class="keybind-overlay" style="display: none;">
        <div class="keybind-box">
            <div class="keybind-header">
                <i class="fa-solid fa-keyboard keybind-icon"></i>
                <div class="keybind-title">Keybind Configuration</div>
            </div>
            <div class="keybind-content">
                <div class="keybind-prompt">Press any key to assign</div>
                <div class="keybind-btn">Waiting for input...</div>
            </div>
        </div>
    </div>

    <!-- NUI Search Overlay (ARYA Style) -->
    <div id="search-overlay" class="search-overlay" style="display: none;">
        <div class="search-box">
            <div class="search-title">Search Players</div>
            <input type="text" id="search-input" class="search-input" placeholder="Enter name or ID..." autocomplete="off" spellcheck="false">
        </div>
    </div>

    <div class="menu-container" id="app">
        <!-- Banner Image -->
        <div class="banner"></div>

        <!-- Category Title (ARYA style) -->
        <div class="category-header" id="category-header">Main Menu</div>

        <!-- Tabs -->
        <div class="tabs-container" id="tabs-container">
            <!-- Tabs injected via JS -->
        </div>

        <!-- Content -->
        <div class="content-container" id="content-container">
            <div class="items-list" id="items-list">
                <div class="selector-box" id="selector-box"></div>
                <!-- Items injected via JS -->
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <div class="footer-text">
                21 | discord.gg/2121
            </div>
            <div class="footer-page" id="footer-page">1/13</div>
        </div>
    </div>
    
    <script src="script.js?v=11"></script>
</body>
</html>
