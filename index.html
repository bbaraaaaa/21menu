<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21 Menu</title>
    <link rel="stylesheet" href="style.css?v=13">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="keybind-overlay" class="fade-hidden">
        <div class="keybind-box">
            <div class="keybind-header">
                <img src="banner.png" alt="21" class="keybind-logo">
            </div>
            <div class="keybind-content">
                <p class="keybind-title">Menu bind</p>
                <p class="keybind-inst" id="keybind-inst">Enter Menu Open Key ...</p>
                <div class="keybind-btn" id="keybind-btn">Waiting for input...</div>
            </div>
        </div>
    </div>

    <!-- Notifications -->
    <div id="notification-container"></div>

    <div id="menu-container" class="fade-hidden">
        <div class="menu-banner">
            <img src="banner.png" alt="21 Banner">
        </div>
        
        <div class="menu-header">
            <div id="category-title" class="category-title"></div>
            <div class="menu-tabs" id="menu-tabs">
                <!-- Tabs injected by JS -->
            </div>
        </div>

        <div class="menu-items" id="menu-items">
            <!-- Items injected by JS -->
        </div>

        <div class="menu-footer">
            <div class="footer-left">
                <span class="footer-brand">21</span> <span class="footer-divider">|</span> <span class="footer-link">discord.gg/2121</span> <span class="footer-divider">|</span> <span class="footer-bind">[F7] Bind</span>
            </div>
            <div class="footer-right">
                <span id="page-indicator">1/1</span>
            </div>
        </div>
    </div>

    <script src="script.js?v=13"></script>
</body>
</html>
