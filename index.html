<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>21 SAVAGE MENU</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <!-- Keybind Popup Overlay -->
    <div id="keybind-overlay" style="display: flex;">
        <div class="keybind-box">
            <div class="keybind-header">
                <img src="https://i.imgur.com/3q1jO7F.png" alt="icon">
                <span>callmeanger</span>
            </div>
            <p class="keybind-title">Menu bind</p>
            <p class="keybind-instruction" id="keybind-inst">Enter Menu Open Key ...</p>
            <div class="keybind-btn" id="keybind-btn">Waiting for input...</div>
        </div>
    </div>

    <!-- Main Menu UI -->
    <div id="menu-container" style="display: none;">
        <div class="banner">
            <img src="banner.jpg" alt="21 SAVAGE" onerror="this.src='https://i.imgur.com/c6Oqz7P.png'">
        </div>
        <div class="header">
            <h2>MAIN MENU</h2>
        </div>
        <div class="sub-header" id="sub-header-title">
            Main menu
        </div>
        
        <div class="items-list" id="items-list">
            <!-- Items injected by JS -->
        </div>

        <div class="footer">
            <span>21 | discord.gg/0e | [F7] Bind</span>
            <span id="pagination">1/8</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
